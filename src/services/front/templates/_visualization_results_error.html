{% if result and result.results_status == "error" %}
    <div class="alert alert-danger" role="alert">
      Failed to load job results: {{ result.results_error or "No error details were reported." }}
      <form method="post" action="{{ url_for('onSimulationGroupRetryVisualize', job_id=group_id) }}" class="d-inline">
        <input type="hidden" name="next" value="{{ request.full_path }}">
        <button type="submit" class="btn btn-sm btn-outline-danger ms-2">Retry loading job results</button>
      </form>
    </div>
  {% endif %}
