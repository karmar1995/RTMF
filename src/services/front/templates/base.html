<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}RTMF{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="{{ url_for('static', filename='js/plotly.min.js') }}"></script>
  {% block head %} {% endblock %}
</head>
<body class="bg-light">
  <div class="container-fluid">
    <div class="row">
      {% include "_sidebar.html" %}
      <div class="col-9 col-md-10 p-4">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.querySelectorAll('[data-utc-datetime]').forEach(function(el) {
      var raw = el.getAttribute('data-utc-datetime');
      if (!raw) return;
      var tzPattern = /(?:Z|[+-]\d{2}:\d{2})$/;
      var text = raw.trim();
      if (!tzPattern.test(text)) text += 'Z';
      var dt = new Date(text);
      if (isNaN(dt.getTime())) return;
      el.textContent = dt.toLocaleString();
    });
  </script>
</body>
</html>
